name: Release

# Every push to main runs release-please, which keeps a release PR open with the next
# version and CHANGELOG built from the Conventional Commits since the last tag.
# Merging that PR tags vX.Y.Z and creates the GitHub release; the same run then tests,
# builds and publishes to PyPI through trusted publishing (OIDC), so no API token is
# stored in the repository.
#
# Publishing lives in this workflow, not one triggered by `release: published`, because
# a release created with GITHUB_TOKEN does not start other workflows.
on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v7
      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version=$(uv version --short)
          if [ "v${version}" != "${TAG_NAME}" ]; then
            echo "Tag ${TAG_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/faker-pyspark/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
