[project]
name = "faker-pyspark"
version = "0.9.0"
description = "faker-pyspark is a PySpark DataFrame and Schema provider for the Faker python package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sury Soni", email = "github@suryasoni.info" }]
keywords = ["Faker", "PySpark", "Spark", "DataFrame", "test data", "fake data"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["faker>=18.11"]

[project.optional-dependencies]
# PySpark is an extra so that installing on a cluster that already ships Spark
# (Databricks, EMR, Glue) does not pull a second copy over the runtime's own.
pyspark = ["pyspark>=3.4"]
# What Spark needs to generate rows on the executors (Arrow batches). Clusters such as
# Databricks already have both.
distributed = ["pandas>=2.2.2", "pyarrow>=16"]

[project.urls]
Homepage = "https://github.com/spsoni/faker-pyspark"
Repository = "https://github.com/spsoni/faker-pyspark"
Issues = "https://github.com/spsoni/faker-pyspark/issues"
Changelog = "https://github.com/spsoni/faker-pyspark/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "hypothesis>=6.150",
    "mypy>=1.13",
    "pandas>=2.2.2,<3",
    "prek>=0.5.10",
    "pyarrow>=16",
    # The connect extra adds the gRPC client, so the suite can also run over Spark
    # Connect: SPARK_REMOTE="local[2]" uv run pytest
    "pyspark[connect]>=3.4",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain cooldown: never resolve to a release younger than a week.
# Dependabot uses the same window (.github/dependabot.yml).
exclude-newer = "7 days"

[tool.uv.build-backend]
# Flat layout: the package directory sits at the repository root, not under src/.
module-name = "faker_pyspark"
module-root = ""
source-include = ["tests/**", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Keep hand-aligned comments in documentation code samples.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "BLE",      # blind except
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=faker_pyspark --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
